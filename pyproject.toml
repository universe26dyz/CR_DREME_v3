[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cardioresp4d"
version = "0.1.0"
description = "Phase 1 data preparation for CardioResp 4D MRI"
requires-python = ">=3.9"
dependencies = ["numpy", "pydicom", "PyYAML", "scipy", "matplotlib", "nibabel"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
